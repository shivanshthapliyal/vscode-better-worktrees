name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Ahead of lint and tests so a type error fails on its own terms rather
      # than surfacing later inside the packaging step.
      - run: npm run compile

      - run: npm run lint

      - run: npm test

      - run: npm run package

      - uses: actions/upload-artifact@v7
        with:
          name: vsix
          path: "*.vsix"
